name: secsuite
description: Stack-aware security scan gate - Semgrep, Trivy, and Gitleaks in one normalized report with CI exit codes.
branding:
  icon: shield
  color: purple

# Requires a Linux runner and a prior actions/checkout step (use
# fetch-depth: 0 so Gitleaks can scan git history).
inputs:
  path:
    description: Directory to scan
    default: "."
  severity:
    description: Minimum severity that fails the job (critical|high|medium|low|info)
    default: high
  sarif-file:
    description: If set, write merged findings as SARIF here (upload with github/codeql-action/upload-sarif)
    default: ""
  baseline:
    description: Set to "false" to ignore a committed .secsuite-baseline.json
    default: "true"

runs:
  using: composite
  steps:
    - name: Install scanners
      shell: bash
      run: |
        pipx install semgrep
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
        curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
        sudo mv /tmp/gitleaks /usr/local/bin/

    - name: Install secsuite
      shell: bash
      # secsuite is a single static binary, so this replaces what used to be a
      # setup-node step plus `npx secsuite@latest`.
      env:
        # The ref this action was called with: "v0.3.0" when pinned to a tag,
        # or a branch name when someone tracks a moving ref.
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64)          ARCH=amd64 ;;
          aarch64 | arm64) ARCH=arm64 ;;
          *) echo "::error::unsupported runner architecture: $(uname -m)"; exit 2 ;;
        esac

        BASE=https://github.com/kousthubha-sky/secsuite-cli/releases
        case "$ACTION_REF" in
          v[0-9]*) URL="$BASE/download/$ACTION_REF/secsuite_linux_${ARCH}.tar.gz" ;;
          *)       URL="$BASE/latest/download/secsuite_linux_${ARCH}.tar.gz" ;;
        esac

        echo "installing secsuite from $URL"
        curl -sfL "$URL" | sudo tar -xz -C /usr/local/bin secsuite
        secsuite version

    - name: Run secsuite
      shell: bash
      # Inputs go through env, never interpolated into the script - `${{ }}`
      # inside `run:` is the GitHub Actions script-injection pattern.
      env:
        SCAN_PATH: ${{ inputs.path }}
        SEVERITY: ${{ inputs.severity }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        USE_BASELINE: ${{ inputs.baseline }}
      run: |
        ARGS="scan $SCAN_PATH --severity $SEVERITY"
        if [ -n "$SARIF_FILE" ]; then ARGS="$ARGS --sarif $SARIF_FILE"; fi
        if [ "$USE_BASELINE" = "false" ]; then ARGS="$ARGS --no-baseline"; fi
        secsuite $ARGS
