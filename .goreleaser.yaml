# GoReleaser builds the cross-compiled binaries and creates the GitHub Release.
# That release is the source of truth every other install channel pulls from:
# the npm platform packages, the Docker image, and action.yml.
#
# Local dry run (no tag, no upload):  goreleaser release --snapshot --clean
version: 2

project_name: secsuite

before:
  hooks:
    - go mod tidy

builds:
  - id: secsuite
    main: ./cmd/secsuite
    binary: secsuite
    env:
      - CGO_ENABLED=0
    # -s -w drops the symbol table and DWARF info; main.version is the var
    # declared in cmd/secsuite/main.go.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM is not worth a release asset until someone asks.
      - goos: windows
        goarch: arm64

archives:
  - id: secsuite
    ids: [secsuite]
    # Deliberately no version in the name: it makes
    # /releases/latest/download/secsuite_linux_amd64.tar.gz a stable URL, which
    # is what action.yml and any install script want. Pinned downloads still
    # work via /releases/download/vX.Y.Z/<same name>.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # A tag like v0.3.0-rc.1 lands as a GitHub prerelease automatically, which is
  # how you rehearse the whole pipeline without shipping it.
  prerelease: auto
